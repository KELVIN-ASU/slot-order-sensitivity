[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "artifacts", "calibration", "configuration", "data", "diagnostics",
    "inference", "mixtures", "models", "pipeline", "probability", "reporting",
    "reproducibility", "result_summaries", "statistical_analysis", "training",
    "visualization",
]
